[package]
name = "caudal"
version = "0.1.0"
description = "Caudal: seguimiento personal de inversiones"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "caudal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.7", features = [] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
tauri-plugin-dialog = "2.8.4"
reqwest = { version = "0.13.5", default-features = false, features = ["gzip", "native-tls"] }
tokio = { version = "1.54.1", features = ["time"] }
